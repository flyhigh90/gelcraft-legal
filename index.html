<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelCraft — Legal &amp; Privacy</title>
<meta name="description" content="Privacy policy and account deletion for the GelCraft bioprinting laboratory app.">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1d24; --muted: #5a6472; --rule: #e3e7ed;
    --accent: #0f6e7d; --card: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1b2a; --fg: #e6edf3; --muted: #9aa7b5; --rule: #22303f;
      --accent: #4fd1c5; --card: #132436;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 1.1rem 1.25rem; margin-bottom: .9rem; transition: border-color .15s ease;
  }
  a.card:hover { border-color: var(--accent); }
  a.card strong { display: block; color: var(--accent); font-size: 1.05rem; margin-bottom: .2rem; }
  a.card span { color: var(--muted); font-size: .92rem; }
  footer {
    margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: .88rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>

<h1>GelCraft</h1>
<p class="tagline">Bioprinting and cell-culture laboratory assistant.</p>

<a class="card" href="privacy.html">
  <strong>Privacy Policy</strong>
  <span>What the app collects, why, and how it is protected.</span>
</a>

<a class="card" href="delete-account.html">
  <strong>Delete Your Account</strong>
  <span>Remove your account and all associated data.</span>
</a>

<footer>
  Questions: <a href="mailto:privacy@gelcraft.app">privacy@gelcraft.app</a>
</footer>

</main>
</body>
</html>
